services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dsrvm
      POSTGRES_PASSWORD: dsrvm-local
      POSTGRES_DB: dsrvm
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  db-data:
