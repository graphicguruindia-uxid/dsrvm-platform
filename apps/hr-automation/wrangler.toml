name = "dsrvm-hr-automation"
main = "dist/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
NODE_ENV = "production"

[[kv_namespaces]]
binding = "KV_RUNBOOKS"
id = "kv_runbooks_placeholder"

[env.staging]
vars = { NODE_ENV = "staging" }

[env.staging.kv_namespaces]
binding = "KV_RUNBOOKS"
id = "kv_runbooks_staging"

[env.production]
vars = { NODE_ENV = "production" }

[env.production.kv_namespaces]
binding = "KV_RUNBOOKS"
id = "kv_runbooks_production"
